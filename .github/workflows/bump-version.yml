# Bumps the project's version key in the Xcode project (MARKETING_VERSION if
# present, falling back to CURRENT_PROJECT_VERSION for older-style projects
# that predate the MARKETING_VERSION/CURRENT_PROJECT_VERSION split), commits
# it, and pushes a "vX.Y.Z" tag. That tag push is what triggers release.yml -
# this workflow does NOT build or release anything itself.
#
# Run it manually from the Actions tab whenever you're ready to cut a release.

name: Bump version

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: Semantic version bump
        options:
          - patch
          - minor
          - major
        default: patch
        required: true

permissions:
  contents: write

env:
  # ---- edit these two per-project ----
  XCODE_PROJECT: Common Crypto.xcodeproj
  # -------------------------------------

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: bump project version
        id: bump
        run: |
          set -euo pipefail
          PBXPROJ="${XCODE_PROJECT}/project.pbxproj"

          KEY="MARKETING_VERSION"
          CURRENT=$(grep -m1 "$KEY" "$PBXPROJ" | sed -E "s/.*${KEY} = ([0-9]+\.[0-9]+\.[0-9]+);.*/\1/") || true
          if [ -z "$CURRENT" ]; then
            KEY="CURRENT_PROJECT_VERSION"
            CURRENT=$(grep -m1 "$KEY" "$PBXPROJ" | sed -E "s/.*${KEY} = ([0-9]+\.[0-9]+\.[0-9]+);.*/\1/") || true
          fi
          if [ -z "$CURRENT" ]; then
            echo "Could not find MARKETING_VERSION or CURRENT_PROJECT_VERSION in $PBXPROJ" >&2
            exit 1
          fi
          echo "Using key: $KEY"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "${{ inputs.mode }}" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            patch) PATCH=$((PATCH+1)) ;;
          esac
          NEW="${MAJOR}.${MINOR}.${PATCH}"

          echo "Bumping ${CURRENT} -> ${NEW}"
          sed -i "s/${KEY} = ${CURRENT};/${KEY} = ${NEW};/g" "$PBXPROJ"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$PBXPROJ"
          git commit -m "chore: bump version to ${NEW}"
          git tag "v${NEW}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
          git push origin "v${NEW}"

          echo "version=${NEW}" >> "$GITHUB_OUTPUT"

      - name: summary
        run: echo "### Bumped to v${{ steps.bump.outputs.version }} - release.yml will pick up the pushed tag." >> "$GITHUB_STEP_SUMMARY"
